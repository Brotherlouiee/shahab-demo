name: Container build contract smoke

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  images:
    name: Build and run two isolated images
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Build independent reference static files
        run: |
          npm ci
          npm run build
      - name: Build and smoke both images without publishing
        run: python tests/images/smoke.py
      - name: Preserve count-only build evidence
        uses: actions/upload-artifact@v4
        with:
          name: container-build-contract-evidence
          path: test-results/image-smoke.json
          if-no-files-found: error
          retention-days: 7
