name: Container build contract smoke

on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      export_images:
        type: boolean
        default: false
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: image-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOCKER_BUILD_SUMMARY: 'false'
  DOCKER_BUILD_RECORD_UPLOAD: 'false'
  BUILDX_METADATA_PROVENANCE: max

jobs:
  images:
    name: Build and run two isolated images
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: shahab_image
          POSTGRES_USER: shahab_image
          POSTGRES_PASSWORD: synthetic-image-test
        options: >-
          --health-cmd "pg_isready -U shahab_image -d shahab_image"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Test security and release fail-closed policies
        run: python -m unittest discover -s tests/images -p 'test_*.py' -v
      - name: Build independent reference static files
        run: |
          npm ci
          npm run build
          mkdir -p test-results/images
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          version: v0.38.0
          buildkitd-flags: --oci-worker-gc
          driver-opts: |
            image=moby/buildkit:v0.34.0@sha256:b059f8d7226d0b326bc871af489a5dddf65e36af4d20d14251b072974d9ee87c
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 2
              gc = true
              reservedSpace = '256MB'
              maxUsedSpace = '1GB'
      - name: Build API once, load locally, never push
        id: api
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: shahab-ci-api:sha-${{ env.SOURCE_SHA }}
          labels: org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
          build-args: SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
          cache-from: type=gha,scope=shahab-api-amd64-v1,version=2
          cache-to: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'type=gha,scope=shahab-api-amd64-v1,mode=min,version=2,timeout=60s' || '' }}
      - name: Build frontend once, load locally, never push
        id: web
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: frontend/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: shahab-ci-web:sha-${{ env.SOURCE_SHA }}
          labels: org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
          build-args: SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
          cache-from: type=gha,scope=shahab-web-amd64-v1,version=2
          cache-to: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'type=gha,scope=shahab-web-amd64-v1,mode=min,version=2,timeout=60s' || '' }}
      - name: Preserve build metadata, with no registry credentials
        if: ${{ always() }}
        run: |
          python - <<'PYCODE'
          import json, os
          from pathlib import Path
          # These pinned build-push-action/toolkit versions write their CLI
          # --metadata-file here. Read files directly: max provenance exceeds
          # Linux's per-environment-variable limit. Never trim provenance.
          expected = {
              'docker.io/library/shahab-ci-' + name + ':sha-' + os.environ['SOURCE_SHA']: name
              for name in ('api', 'web')
          }
          seen = set()
          for path in Path(os.environ['RUNNER_TEMP']).glob('docker-actions-toolkit-*/build-metadata-*.json'):
              value = json.loads(path.read_text())
              name = expected.get(value.get('image.name'))
              if name is None:
                  continue
              if name in seen:
                  raise ValueError('Ambiguous build metadata for ' + name)
              seen.add(name)
              Path('test-results/images/' + name + '-build.json').write_bytes(path.read_bytes())
          print('Build metadata files retained:', sorted(seen))
          PYCODE
      - name: Verify native imports and PostgreSQL from the final API image
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          db_network=$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.NetworkID}}{{end}}' "$PG_CONTAINER")
          docker run --rm -i --network "$db_network" --cap-drop=ALL --security-opt=no-new-privileges \
            --entrypoint python "shahab-ci-api:sha-$SOURCE_SHA" - <<'PYCODE'
          import psycopg, sqlalchemy, uvloop, httptools
          with psycopg.connect('host=postgres dbname=shahab_image user=shahab_image password=synthetic-image-test') as conn:
              assert conn.execute('select 1').fetchone() == (1,)
          engine = sqlalchemy.create_engine('postgresql+psycopg://shahab_image:synthetic-image-test@postgres/shahab_image')
          with engine.connect() as conn:
              assert conn.execute(sqlalchemy.text('select 1')).scalar_one() == 1
          engine.dispose()
          print('Final-image native imports and psycopg/SQLAlchemy PostgreSQL connections passed')
          PYCODE
      - name: Smoke the exact loaded images without rebuilding
        run: python tests/images/smoke.py --api-image "shahab-ci-api:sha-$SOURCE_SHA" --web-image "shahab-ci-web:sha-$SOURCE_SHA"
      - name: Install checksum-pinned Trivy, no package-manager scripts
        env:
          TRIVY_VERSION: 0.76.0
        run: |
          tool_dir="$RUNNER_TEMP/shahab-trivy"
          mkdir -p "$tool_dir"
          curl --fail --silent --show-error --location --retry 2 --max-time 90 \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            -o "$tool_dir/trivy.tar.gz"
          echo "e24b1c51293c1b15e4ba8d45bbc7891ba053f90278ec2698f3562c993e145fe7  $tool_dir/trivy.tar.gz" | sha256sum --check
          tar -xzf "$tool_dir/trivy.tar.gz" -C "$tool_dir" trivy
          echo "$tool_dir" >> "$GITHUB_PATH"
      - name: Scan both exact images, enforce policy and produce SBOMs
        env:
          TRIVY_CACHE_DIR: ${{ runner.temp }}/shahab-trivy-db
          TRIVY_NO_PROGRESS: 'true'
          TRIVY_TIMEOUT: 3m
        run: python tests/images/security_gate.py
      - name: Export and reload the exact scanned images, with no registry credentials
        run: |
          mkdir -p "$RUNNER_TEMP/shahab-release-images"
          docker save --output "$RUNNER_TEMP/shahab-release-images/api.tar" "shahab-ci-api:sha-$SOURCE_SHA"
          docker save --output "$RUNNER_TEMP/shahab-release-images/web.tar" "shahab-ci-web:sha-$SOURCE_SHA"
          docker image rm "shahab-ci-api:sha-$SOURCE_SHA" "shahab-ci-web:sha-$SOURCE_SHA"
          python - <<'PYCODE'
          import json, subprocess
          from pathlib import Path
          for image_id in json.loads(Path('test-results/image-smoke.json').read_text())['imageIds']:
              result = subprocess.run(['docker', 'image', 'inspect', image_id], capture_output=True)
              assert result.returncode != 0, 'Archive test requires images to be absent before reload'
          PYCODE
          docker load --input "$RUNNER_TEMP/shahab-release-images/api.tar"
          docker load --input "$RUNNER_TEMP/shahab-release-images/web.tar"
          python - <<'PYCODE'
          import json, subprocess
          from pathlib import Path
          smoke = json.loads(Path('test-results/image-smoke.json').read_text())
          for image_id in smoke['imageIds']:
              loaded = json.loads(subprocess.check_output(['docker', 'image', 'inspect', image_id]))[0]
              assert loaded['Id'] == image_id
              assert loaded['Config']['Labels']['org.opencontainers.image.revision'] == smoke['sourceSha']
          print('Archive round-trip preserves both tested/scanned image identities')
          PYCODE
      - name: Exercise VM Compose with the already-built candidates
        # Historical approved sources before this VM config do not contain it.
        if: ${{ hashFiles('docker-compose.prod.yml') != '' }}
        run: >-
          python tests/images/vm_compose_smoke.py
          --api-image "shahab-ci-api:sha-$SOURCE_SHA"
          --web-image "shahab-ci-web:sha-$SOURCE_SHA"
      - name: Preserve candidate images for the protected publish job
        if: ${{ inputs.export_images && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v4
        with:
          name: shahab-release-images
          path: ${{ runner.temp }}/shahab-release-images/*.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Preserve build, smoke, scan and SBOM evidence even on failure
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: container-build-contract-evidence
          path: |
            test-results/image-smoke.json
            test-results/vm-compose.json
            test-results/images/*.json
          if-no-files-found: error
          retention-days: 7
