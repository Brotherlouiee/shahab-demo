name: Quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test,quality]"
      - run: npm ci
      - run: npm run quality
  postgresql-migrations:
    name: PostgreSQL migration verification
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: shahab_test
          POSTGRES_USER: shahab_test
          POSTGRES_PASSWORD: test-password-not-a-secret
        options: >-
          --health-cmd "pg_isready -U shahab_test -d shahab_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
        ports:
          - 5432:5432
    env:
      SHAHAB_TEST_DATABASE_URL: postgresql+psycopg://shahab_test:test-password-not-a-secret@127.0.0.1:5432/shahab_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test,quality]"
      - run: python -m unittest backend.tests.test_postgresql_migrations
