name: Quality gates
'on':
  pull_request: null
  push:
    branches:
    - main
permissions:
  contents: read
jobs:
  quality:
    name: Quality gates
    runs-on:
    - self-hosted
    - Linux
    - X64
    - shahab-local
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - name: Run verification in prepared local image
      run: bash scripts/ci/run-local-container.sh
      env:
        SHAHAB_CI_PYTHON_PROFILE: project
        SHAHAB_CI_COMMANDS: |
          npm ci
          echo '::group::Verify generated API artifacts'
          python -m scripts.export_api_docs --check
          echo '::endgroup::'
          node --test tests/ci/local-container.test.mjs tests/ci/e2e-partition.test.mjs
          python -m unittest discover -s tests/ci -p test_python_environment_cache.py
          python -m unittest discover -s tests/ci -p test_postgresql_suite_runner.py
          npm run quality
    - name: Clean resources owned by this job attempt
      if: always()
      run: bash scripts/ci/cleanup-local-container.sh
  postgresql-migrations:
    name: PostgreSQL migration verification
    runs-on:
    - self-hosted
    - Linux
    - X64
    - shahab-local
    timeout-minutes: 10
    env:
      SHAHAB_TEST_DATABASE_URL: postgresql+psycopg://shahab_test:test-password-not-a-secret@postgres:5432/shahab_test
    steps:
    - uses: actions/checkout@v4
    - name: Run verification in prepared local image
      run: bash scripts/ci/run-local-container.sh
      env:
        SHAHAB_CI_PYTHON_PROFILE: project
        SHAHAB_CI_COMMANDS: |
          python -m scripts.ci.run_postgresql_suites
        SHAHAB_CI_DATABASE: shahab_test
    - name: Clean resources owned by this job attempt
      if: always()
      run: bash scripts/ci/cleanup-local-container.sh
  loan-details-e2e:
    name: Loan details browser verification
    env:
      SHAHAB_BOOKMARK_BASELINE_DIR: /tmp/shahab-bookmark-baseline
      SHAHAB_BOOKMARK_BASELINE_URL: http://127.0.0.1:4175
    runs-on:
    - self-hosted
    - Linux
    - X64
    - shahab-local
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - name: Run verification in prepared local image
      run: bash scripts/ci/run-local-container.sh
      env:
        SHAHAB_CI_COMMANDS: |
          npm ci
          echo '::group::Prepare independent accepted pre-F frontend baseline'
          git fetch --no-tags --depth=1 origin d4197e94b24da8cb91e277a7cb1d82be936bbd07
          git worktree add --detach "$SHAHAB_BOOKMARK_BASELINE_DIR" d4197e94b24da8cb91e277a7cb1d82be936bbd07
          ln -s "$GITHUB_WORKSPACE/node_modules" "$SHAHAB_BOOKMARK_BASELINE_DIR/node_modules"
          echo '::endgroup::'
          npm run build
          npm --prefix "$SHAHAB_BOOKMARK_BASELINE_DIR" run build
          echo '::group::Verify every original browser test is assigned exactly once'
          mkdir -p test-results
          npx playwright test --list --reporter=json > test-results/e2e-original-list.json
          SHAHAB_E2E_BUILT=1 npx playwright test --list --reporter=json > test-results/e2e-built-list.json
          npx playwright test tests/e2e/initial-and-questionnaire-loading.spec.mjs tests/e2e/recommendation-result-journey.spec.mjs --list --reporter=json > test-results/e2e-development-list.json
          node scripts/ci/verify_e2e_partition.mjs test-results/e2e-original-list.json test-results/e2e-built-list.json test-results/e2e-development-list.json
          echo '::endgroup::'
          echo '::group::Verify built application'
          SHAHAB_E2E_BUILT=1 npx playwright test --reporter=line --output=test-results/built
          echo '::endgroup::'
          echo '::group::Verify dev-only loading and HTML harness'
          env -u SHAHAB_BOOKMARK_BASELINE_DIR -u SHAHAB_BOOKMARK_BASELINE_URL npx playwright test tests/e2e/initial-and-questionnaire-loading.spec.mjs tests/e2e/recommendation-result-journey.spec.mjs --reporter=line --output=test-results/development
          echo '::endgroup::'
    - name: Clean resources owned by this job attempt
      if: always()
      run: bash scripts/ci/cleanup-local-container.sh
    - name: Upload synthetic visual comparison evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: us-11-t02f-visual-evidence
        path: test-results/
        retention-days: 7
  profile-live-e2e:
    name: Profile OTP real API browser verification
    runs-on:
    - self-hosted
    - Linux
    - X64
    - shahab-local
    timeout-minutes: 10
    env:
      SHAHAB_ENVIRONMENT: local
      SHAHAB_API_DOCS_INCLUDE_OPERATIONS: 'true'
      SHAHAB_DATABASE_URL: postgresql+psycopg://shahab_test:test-password-not-a-secret@postgres:5432/shahab_profile_test
    steps:
    - uses: actions/checkout@v4
    - name: Run verification in prepared local image
      run: bash scripts/ci/run-local-container.sh
      env:
        SHAHAB_CI_PYTHON_PROFILE: project
        SHAHAB_CI_COMMANDS: |
          python -m alembic upgrade head
          npm ci
          npx playwright test --config playwright.profile-live.config.mjs
        SHAHAB_CI_DATABASE: shahab_profile_test
    - name: Clean resources owned by this job attempt
      if: always()
      run: bash scripts/ci/cleanup-local-container.sh
    - name: Upload real API browser evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: us-11-t02f-real-api-evidence
        path: test-results/
        retention-days: 7

