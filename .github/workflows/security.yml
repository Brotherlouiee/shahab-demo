name: Security SAST, SCA and secret gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-and-dependencies:
    name: Python SAST and Python/Node dependency audit
    runs-on: [self-hosted, Linux, X64, shahab-local]
    container: ubuntu:24.04
    defaults:
      run:
        shell: bash
    timeout-minutes: 12
    steps:
      - name: Prepare disposable Ubuntu tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git python3 python3-venv
          python3 -m venv /opt/shahab-ci-venv
          echo /opt/shahab-ci-venv/bin >> "$GITHUB_PATH"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install project dependencies and pinned security tooling
        run: |
          python -m pip install -e ".[test,quality]"
          python -m pip install "bandit==1.8.6" "pip-audit==2.9.0"
          npm ci
      - name: SAST — fail on medium/high-confidence high-severity findings
        run: python -m bandit -q -r backend/app scripts -ll -ii
      - name: Python SCA — reject known vulnerable installed dependencies
        run: python -m pip_audit --progress-spinner off
      - name: Node SCA — reject high/critical advisories, including dev dependencies
        run: npm audit --audit-level=high
      - name: Existing repository secret scan
        run: python scripts/scan_repository_secrets.py
