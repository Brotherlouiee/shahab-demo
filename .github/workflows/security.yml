name: Security SAST, SCA and secret gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  change-scope:
    name: Classify changes and run lightweight documentation checks
    runs-on: ubuntu-24.04
    outputs:
      run_security: ${{ steps.scope.outputs.run_security }}
    steps:
      - uses: actions/checkout@v4
      - id: scope
        name: Classify changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          HEAD_SHA: ${{ github.sha }}
          FORCE_FULL: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' }}
        run: python scripts/ci/classify_changes.py
  repository-secrets:
    name: Repository secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Scan repository secrets
        run: python scripts/scan_repository_secrets.py
  static-and-dependencies:
    name: Python SAST and Python/Node dependency audit
    needs: change-scope
    if: needs.change-scope.outputs.run_security == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install project dependencies and pinned security tooling
        run: |
          python -m pip install --upgrade "pip>=26.2"
          python -m pip install -e ".[test,quality]"
          python -m pip install "bandit==1.8.6" "pip-audit==2.9.0"
          npm ci
      - name: SAST — fail on medium/high-confidence high-severity findings
        run: python -m bandit -q -r backend/app scripts -ll -ii
      - name: Python SCA — reject known vulnerable installed dependencies
        run: python -m pip_audit --progress-spinner off
      - name: Node SCA — reject high/critical advisories, including dev dependencies
        run: npm audit --audit-level=high
