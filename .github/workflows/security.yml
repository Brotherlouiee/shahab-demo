name: Security SAST, SCA and secret gates
'on':
  pull_request: null
  push:
    branches:
    - main
permissions:
  contents: read
jobs:
  static-and-dependencies:
    name: Python SAST and Python/Node dependency audit
    runs-on:
    - self-hosted
    - Linux
    - X64
    - shahab-local
    timeout-minutes: 12
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: 'false'
    - name: Run verification in prepared local image
      run: bash scripts/ci/run-local-container.sh
      env:
        SHAHAB_CI_COMMANDS: |
          echo '::group::Install project dependencies and pinned security tooling'
          python -m pip install -e ".[test,quality]"
          python -m pip install "bandit==1.8.6" "pip-audit==2.9.0"
          npm ci
          echo '::endgroup::'
          echo '::group::SAST — fail on medium/high-confidence high-severity findings'
          python -m bandit -q -r backend/app scripts -ll -ii
          echo '::endgroup::'
          echo '::group::Python SCA — reject known vulnerable installed dependencies'
          python -m pip_audit --progress-spinner off
          echo '::endgroup::'
          echo '::group::Node SCA — reject high/critical advisories, including dev dependencies'
          npm audit --audit-level=high
          echo '::endgroup::'
          echo '::group::Existing repository secret scan'
          python scripts/scan_repository_secrets.py
          echo '::endgroup::'
