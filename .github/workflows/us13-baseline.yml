name: US-13 frozen frontend baseline evidence
'on':
  pull_request: null
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  capture-baseline:
    name: Independent original-vs-candidate route evidence
    runs-on:
    - self-hosted
    - Linux
    - X64
    - shahab-local
    timeout-minutes: 12
    env:
      SHAHAB_US13_BASELINE_DIR: /tmp/shahab-us13-original
      SHAHAB_US13_BASELINE_URL: http://127.0.0.1:4177
    steps:
    - uses: actions/checkout@v4
    - name: Run verification in prepared local image
      run: bash scripts/ci/run-local-container.sh
      env:
        SHAHAB_CI_COMMANDS: |
          npm ci
          echo '::group::Isolate immutable accepted frontend'
          git fetch --no-tags --depth=1 origin f5e50da0ea29b7d933a813736a2616169ee9b8f3
          git worktree add --detach "$SHAHAB_US13_BASELINE_DIR" f5e50da0ea29b7d933a813736a2616169ee9b8f3
          ln -s "$GITHUB_WORKSPACE/node_modules" "$SHAHAB_US13_BASELINE_DIR/node_modules"
          test "$(git -C "$SHAHAB_US13_BASELINE_DIR" rev-parse HEAD)" = f5e50da0ea29b7d933a813736a2616169ee9b8f3
          echo '::endgroup::'
          echo '::group::Capture original and candidate without UI modifications'
          npm run build
          npm --prefix "$SHAHAB_US13_BASELINE_DIR" run build
          SHAHAB_E2E_BUILT=1 npx playwright test tests/e2e/us13-baseline-inventory.spec.mjs
          echo '::endgroup::'
    - name: Clean resources owned by this job attempt
      if: always()
      run: bash scripts/ci/cleanup-local-container.sh
    - name: Preserve synthetic screenshots and geometry
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: us13-t01-original-vs-candidate
        path: test-results/
        retention-days: 30
