worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Do not log URLs, query strings, cookies, client IPs or authorization.
    log_format bounded '$request_method $status';
    access_log /dev/stdout bounded;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    server_tokens off;
    server {
        listen 8080;
        server_name _;
        root /srv/shahab;
        index index.html;
        client_max_body_size 1m;
        # API cannot fall through to HTML, whether configured or disabled.
        location = /api/v1 { return 404; }
        include /etc/nginx/shahab-api.conf;
        location /assets/ { try_files $uri =404; }
        location / { try_files $uri $uri/ /index.html; }
    }
}
