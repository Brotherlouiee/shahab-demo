[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "shahab-recommendation"
version = "0.1.0"
description = "Staged FastAPI backend for the Shahab loan-recommendation product."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "uvicorn[standard]>=0.32,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "alembic>=1.14,<2.0",
]

[project.optional-dependencies]
test = [
  "httpx2>=0.0.1",
]
quality = [
  "mypy>=1.13,<2.0",
  "ruff>=0.8,<1.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["dist", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["backend/app"]
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
exclude = ["backend/tests"]

[tool.setuptools.packages.find]
include = ["backend*"]
