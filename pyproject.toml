[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "shahab-recommendation"
version = "0.1.0"
description = "Staged FastAPI backend for the Shahab loan-recommendation product."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
test = [
  "httpx2>=0.0.1",
]

[tool.setuptools.packages.find]
include = ["backend*"]
